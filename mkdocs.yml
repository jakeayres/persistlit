site_name: Persistlit
repo_url: https://github.com/jakeayres/persistlit
repo_name: persistlit
site_description: Better perisistent streamlit widgets


nav:
  - Home: index.md
  - Widgets: widgets.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/git
  features:
    - navigation.footer
    - navigation.tabs

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 2
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_docstring_examples: true